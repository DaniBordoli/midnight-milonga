<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width" />
		<style>
			/* The SDK UI asks for "proxima-nova" (an Adobe Typekit font). External fonts are not allowed,
			   so the name points at fonts already installed on the player's device. */
			@font-face {
				font-family: 'proxima-nova';
				font-weight: 100 500;
				src: local('Segoe UI'), local('Helvetica Neue'), local('Roboto'), local('Arial');
			}
			@font-face {
				font-family: 'proxima-nova';
				font-weight: 600 900;
				src: local('Segoe UI Semibold'), local('HelveticaNeue-Bold'), local('Roboto Bold'), local('Arial Bold');
			}
		</style>
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
